name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      locales: ${{ steps.config.outputs.locales }}
      node_version: ${{ steps.config.outputs.node_version }}
      build_command: ${{ steps.config.outputs.build_command }}
      build_output_dir: ${{ steps.config.outputs.build_output_dir }}
      branches: ${{ steps.config.outputs.branches }}
      release: ${{ steps.config.outputs.release }}
      changelog: ${{ steps.config.outputs.changelog }}
      cjk_threshold: ${{ steps.config.outputs.cjk_threshold }}
      zh_cn_readme_match: ${{ steps.config.outputs.zh_cn_readme_match }}
      zh_cn_i18n: ${{ steps.config.outputs.zh_cn_i18n }}
      global_readme_match: ${{ steps.config.outputs.global_readme_match }}
      global_i18n: ${{ steps.config.outputs.global_i18n }}
      branch_allowed: ${{ steps.branch_check.outputs.branch_allowed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read CI config
        id: config
        run: |
          CONFIG_FILE=".github/ci.json"

          if [ -f "$CONFIG_FILE" ]; then
            echo "📄 Found .github/ci.json"
            ENABLED=$(jq -r '.enabled // false' "$CONFIG_FILE")
            NODE_VERSION=$(jq -r '.node_version // "22"' "$CONFIG_FILE")
            BUILD_COMMAND=$(jq -r '.build_command // ""' "$CONFIG_FILE")
            BUILD_OUTPUT_DIR=$(jq -r '.build_output_dir // "build/dist"' "$CONFIG_FILE")
            BRANCHES=$(jq -r '.branches // ["main","master"] | join(",")' "$CONFIG_FILE")
            RELEASE=$(jq -r '.release // true' "$CONFIG_FILE")
            CHANGELOG=$(jq -r '.changelog // true' "$CONFIG_FILE")

            # 解析 locales 配置 (支持对象和数组两种格式)
            LOCALES_TYPE=$(jq -r '.locales | type' "$CONFIG_FILE")
            if [ "$LOCALES_TYPE" = "object" ]; then
              LOCALES=$(jq -r '.locales.build // ["zh-cn","global"] | join(",")' "$CONFIG_FILE")
              CJK_THRESHOLD=$(jq -r '.locales["zh-cn"].readme.cjk_threshold // 10' "$CONFIG_FILE")
              ZH_CN_README=$(jq -r '.locales["zh-cn"].readme.match // ["README_zh.md","README.zh.md","README_zh-*.md","README.zh-*.md"] | join(",")' "$CONFIG_FILE")
              ZH_CN_I18N=$(jq -r '.locales["zh-cn"].i18n // "locales/extensionJson/zh-Hans.json"' "$CONFIG_FILE")
              GLOBAL_README=$(jq -r '.locales.global.readme.match // ["README_EN.md","README_en.md","README.en.md","README_EN-*.md","README_en-*.md","README.en-*.md"] | join(",")' "$CONFIG_FILE")
              GLOBAL_I18N=$(jq -r '.locales.global.i18n // "locales/extensionJson/en.json"' "$CONFIG_FILE")
            else
              LOCALES=$(jq -r '.locales // ["zh-cn","global"] | join(",")' "$CONFIG_FILE")
              CJK_THRESHOLD="10"
              ZH_CN_README="README_zh.md,README.zh.md,README_zh-*.md,README.zh-*.md"
              ZH_CN_I18N="locales/extensionJson/zh-Hans.json"
              GLOBAL_README="README_EN.md,README_en.md,README.en.md,README_EN-*.md,README_en-*.md,README.en-*.md"
              GLOBAL_I18N="locales/extensionJson/en.json"
            fi
          else
            echo "📄 No .github/ci.json found, using defaults (CI disabled)"
            ENABLED="false"
            LOCALES="zh-cn,global"
            NODE_VERSION="22"
            BUILD_COMMAND=""
            BUILD_OUTPUT_DIR="build/dist"
            BRANCHES="main,master"
            RELEASE="true"
            CHANGELOG="true"
            CJK_THRESHOLD="10"
            ZH_CN_README="README_zh.md,README.zh.md,README_zh-*.md,README.zh-*.md"
            ZH_CN_I18N="locales/extensionJson/zh-Hans.json"
            GLOBAL_README="README_EN.md,README_en.md,README.en.md,README_EN-*.md,README_en-*.md,README.en-*.md"
            GLOBAL_I18N="locales/extensionJson/en.json"
          fi

          echo "  enabled:          $ENABLED"
          echo "  locales:          $LOCALES"
          echo "  node_version:     $NODE_VERSION"
          echo "  build_command:    ${BUILD_COMMAND:-<auto>}"
          echo "  build_output_dir: $BUILD_OUTPUT_DIR"
          echo "  branches:         $BRANCHES"
          echo "  release:          $RELEASE"
          echo "  changelog:        $CHANGELOG"
          echo "  cjk_threshold:    $CJK_THRESHOLD"
          echo "  zh_cn_readme:     $ZH_CN_README"
          echo "  zh_cn_i18n:       $ZH_CN_I18N"
          echo "  global_readme:    $GLOBAL_README"
          echo "  global_i18n:      $GLOBAL_I18N"

          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          echo "locales=$LOCALES" >> $GITHUB_OUTPUT
          echo "node_version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "build_command=$BUILD_COMMAND" >> $GITHUB_OUTPUT
          echo "build_output_dir=$BUILD_OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          echo "cjk_threshold=$CJK_THRESHOLD" >> $GITHUB_OUTPUT
          echo "zh_cn_readme_match=$ZH_CN_README" >> $GITHUB_OUTPUT
          echo "zh_cn_i18n=$ZH_CN_I18N" >> $GITHUB_OUTPUT
          echo "global_readme_match=$GLOBAL_README" >> $GITHUB_OUTPUT
          echo "global_i18n=$GLOBAL_I18N" >> $GITHUB_OUTPUT

      - name: Check branch
        id: branch_check
        run: |
          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          ALLOWED_BRANCHES="${{ steps.config.outputs.branches }}"
          echo "Current branch: $CURRENT_BRANCH"
          echo "Allowed branches: $ALLOWED_BRANCHES"

          if echo ",$ALLOWED_BRANCHES," | grep -q ",$CURRENT_BRANCH,"; then
            echo "✅ Branch $CURRENT_BRANCH is allowed"
            echo "branch_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "⏭️ Branch $CURRENT_BRANCH is not in allowed list ($ALLOWED_BRANCHES)"
            echo "branch_allowed=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-config
    if: needs.check-config.outputs.enabled == 'true' && needs.check-config.outputs.branch_allowed == 'true'
    runs-on: ubuntu-latest
    env:
      CI_LOCALES: ${{ needs.check-config.outputs.locales }}
      CI_BUILD_COMMAND: ${{ needs.check-config.outputs.build_command }}
      CI_BUILD_OUTPUT_DIR: ${{ needs.check-config.outputs.build_output_dir }}
      CI_RELEASE: ${{ needs.check-config.outputs.release }}
      CI_CHANGELOG: ${{ needs.check-config.outputs.changelog }}
      CI_CJK_THRESHOLD: ${{ needs.check-config.outputs.cjk_threshold }}
      CI_ZH_CN_README: ${{ needs.check-config.outputs.zh_cn_readme_match }}
      CI_ZH_CN_I18N: ${{ needs.check-config.outputs.zh_cn_i18n }}
      CI_GLOBAL_README: ${{ needs.check-config.outputs.global_readme_match }}
      CI_GLOBAL_I18N: ${{ needs.check-config.outputs.global_i18n }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.check-config.outputs.node_version }}

      - name: Detect project module format (CJS/ESM)
        id: detect_format
        run: |
          echo "🔎 检测项目模块格式..."

          # 方法1: 检查 package.json 中的 "type" 字段
          PKG_TYPE=$(jq -r '.type // empty' package.json 2>/dev/null)
          echo "package.json type: '${PKG_TYPE}'"

          # 方法2: 检查 tsconfig.json 中的 module 设置
          TSC_MODULE=""
          if [ -f "tsconfig.json" ]; then
            TSC_MODULE=$(jq -r '.compilerOptions.module // empty' tsconfig.json 2>/dev/null | tr '[:upper:]' '[:lower:]')
            echo "tsconfig.json module: '${TSC_MODULE}'"
          fi

          # 方法3: 检查 build 脚本是否包含 esbuild/rollup/vite 等 ESM 工具
          BUILD_SCRIPT=$(jq -r '.scripts.build // empty' package.json 2>/dev/null)
          echo "build script: '${BUILD_SCRIPT}'"

          # 方法4: 检查源文件是否使用 import/export 语法
          HAS_IMPORTS=false
          if ls src/*.ts src/*.js src/**/*.ts src/**/*.js 2>/dev/null | head -5 > /dev/null 2>&1; then
            if grep -rl "^import\|^export" src/ --include="*.ts" --include="*.js" 2>/dev/null | head -1 > /dev/null 2>&1; then
              HAS_IMPORTS=true
            fi
          fi
          echo "Has ES module imports: ${HAS_IMPORTS}"

          # 综合判断
          IS_ESM=false

          # 明确指定为 ESM
          if [ "$PKG_TYPE" = "module" ]; then
            IS_ESM=true
            echo "✅ 检测到 ESM: package.json type=module"
          # tsconfig 使用 ESM 相关模块设置
          elif [[ "$TSC_MODULE" == "esnext" || "$TSC_MODULE" == "es2020" || "$TSC_MODULE" == "es2022" || "$TSC_MODULE" == "nodenext" || "$TSC_MODULE" == "node16" ]]; then
            IS_ESM=true
            echo "✅ 检测到 ESM: tsconfig module=${TSC_MODULE}"
          # 使用现代打包工具
          elif echo "$BUILD_SCRIPT" | grep -qE "esbuild|rollup|vite|tsup|unbuild"; then
            IS_ESM=true
            echo "✅ 检测到 ESM: 使用现代打包工具"
          # 明确指定为 CJS
          elif [ "$PKG_TYPE" = "commonjs" ]; then
            IS_ESM=false
            echo "✅ 检测到 CJS: package.json type=commonjs"
          # 默认使用 ESModule 语法的源文件视为 ESM
          elif [ "$HAS_IMPORTS" = "true" ]; then
            # 进一步检查是否有 tsconfig 中明确设置为 CommonJS
            if [[ "$TSC_MODULE" == "commonjs" || "$TSC_MODULE" == "umd" || "$TSC_MODULE" == "amd" ]]; then
              IS_ESM=false
              echo "✅ 检测到 CJS: tsconfig module=${TSC_MODULE}"
            else
              IS_ESM=true
              echo "✅ 检测到 ESM: 源文件使用 import/export 语法"
            fi
          else
            IS_ESM=false
            echo "✅ 默认使用 CJS 模式"
          fi

          echo "IS_ESM=${IS_ESM}" >> $GITHUB_ENV
          echo "is_esm=${IS_ESM}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          if [ "$IS_ESM" = "true" ]; then
            echo "📦 ESM 项目: 安装依赖并添加 tsx"
            npm install
            # ESM 项目需要 tsx 来处理 .ts 文件（ts-node 在 ESM 模式下有兼容问题）
            npm install -D tsx 2>/dev/null || echo "tsx 安装失败或已存在"
          else
            echo "📦 CJS 项目: 使用 npm install"
            npm install
          fi

      - name: Remove CI metadata from package source
        run: |
          # Runner 工作区是临时副本; 构建前移除，确保基础包及后续语言分包均不包含 .github
          rm -rf .github
          echo "Removed .github from the temporary build workspace"

      - name: Build project
        run: |
          # 如果配置了自定义构建命令, 直接使用
          if [ -n "$CI_BUILD_COMMAND" ]; then
            echo "🔨 使用自定义构建命令: $CI_BUILD_COMMAND"
            eval "$CI_BUILD_COMMAND"
            exit $?
          fi

          if [ "$IS_ESM" = "true" ]; then
            echo "🔨 ESM 项目: 执行构建"

            # 检查是否有专门的 esm 构建脚本
            ESM_BUILD_SCRIPT=$(jq -r '.scripts["build:esm"] // empty' package.json 2>/dev/null)
            if [ -n "$ESM_BUILD_SCRIPT" ]; then
              echo "使用 build:esm 脚本"
              npm run build:esm
            else
              echo "使用默认 build 脚本"

              # Node 22+ 对 ESM + ts-node 支持较好，先尝试直接运行
              if npm run build; then
                echo "✅ 构建成功"
              else
                echo "⚠️ 直接构建失败，尝试使用 tsx 替代 ts-node"

                # 安装 tsx
                npm install -D tsx 2>/dev/null || true

                # 备份并临时替换 package.json
                cp package.json package.json.bak
                jq '(.scripts.compile // "") |= gsub("ts-node"; "tsx") | (.scripts.build // "") |= gsub("ts-node"; "tsx")' package.json > package.json.tmp && mv package.json.tmp package.json

                echo "修改后的构建脚本:"
                jq '.scripts | {build, compile}' package.json

                # 使用 tsx 执行构建
                npm run build

                # 恢复原始 package.json
                mv package.json.bak package.json
                echo "✅ 使用 tsx 构建完成"
              fi
            fi
          else
            echo "🔨 CJS 项目: 执行构建"
            npm run build
          fi

      - name: Verify build output format
        id: verify_build
        run: |
          echo "🔍 验证构建输出格式..."

          # 检查构建产物目录
          DIST_DIR="$CI_BUILD_OUTPUT_DIR"
          if [ ! -d "$DIST_DIR" ]; then
            echo "⚠️ 构建产物目录不存在: $DIST_DIR"
            # 尝试其他可能的目录
            for dir in dist build output; do
              if [ -d "$dir" ]; then
                DIST_DIR="$dir"
                echo "✅ 找到构建目录: $dir"
                break
              fi
            done
          fi

          # 检查是否有 .mjs 或 .cjs 文件来确认格式
          if ls "$DIST_DIR"/**/*.mjs 2>/dev/null | head -1 > /dev/null 2>&1; then
            echo "✅ 确认 ESM 格式输出 (.mjs 文件)"
            echo "BUILD_FORMAT=esm" >> $GITHUB_OUTPUT
          elif ls "$DIST_DIR"/**/*.cjs 2>/dev/null | head -1 > /dev/null 2>&1; then
            echo "✅ 确认 CJS 格式输出 (.cjs 文件)"
            echo "BUILD_FORMAT=cjs" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ 无法从文件扩展名判断格式，使用检测结果"
            echo "BUILD_FORMAT=$IS_ESM" >> $GITHUB_OUTPUT
          fi

      - name: Get version & extension name from extension.json
        id: meta
        run: |
          echo "VERSION=$(jq -r .version extension.json)" >> $GITHUB_ENV
          echo "EEXTNAME=$(jq -r .name extension.json)" >> $GITHUB_ENV

      - name: Check and create tag
        id: check_tag
        if: env.CI_RELEASE == 'true'
        run: |
          VERSION=${{ env.VERSION }}
          TAG="v${VERSION}"

          echo "🔎 检查 tag $TAG 是否存在..."
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG 已存在，跳过发布。"
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          else
            echo "✅ Tag $TAG 不存在，创建并推送。"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "SKIP_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Skip release (disabled in config)
        if: env.CI_RELEASE != 'true'
        run: |
          echo "⏭️ Release disabled in .github/ci.json (release: false)"
          echo "SKIP_RELEASE=true" >> $GITHUB_ENV

      - name: Extract changelog for version
        if: env.SKIP_RELEASE == 'false' && env.CI_CHANGELOG == 'true'
        id: changelog
        run: |
          VERSION=${{ env.VERSION }}
          EEXTNAME=${{ env.EEXTNAME }}
          echo "🔎 Extracting changelog for version $VERSION from CHANGELOG.md"
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')

          if [ -f "CHANGELOG.md" ]; then
            # 支持多种 CHANGELOG 格式（兼容大小写 V）：
            # - # v1.5.3 或 # V1.5.3 或 # 1.5.3
            # - ## v1.5.3 或 ## V1.5.3 或 ## 1.5.3
            # - ## [1.5.3] - 2024-01-01 或 ## [v1.5.3]
            NOTES=$(awk '
              BEGIN { found=0 }
              # 匹配版本行（兼容大小写 v/V）
              /^(#|##) \[?[vV]?'"$ESCAPED_VERSION"'\]?([[:space:]-]|$)/ {
                if (found) exit
                found=1
                next
              }
              # 遇到下一个版本标题时停止
              /^(#|##) \[?[vV]?[0-9]+\.[0-9]+\.[0-9]+\]?([[:space:]-]|$)/ {
                if (found) exit
              }
              # 遇到一级标题（如"更新日志"、"Changelog"、"修改记录"）时停止
              /^# [^[\-0-9]/ {
                if (found) exit
              }
              found { print }
            ' CHANGELOG.md)

            # 清理空行
            NOTES=$(echo "$NOTES" | sed '/^[[:space:]]*$/d' | sed '1{/^$/d}')

            if [ -z "$NOTES" ]; then
              echo "⚠️ CHANGELOG.md 中未找到版本 $VERSION 的记录，使用默认说明"
              NOTES="Release v${VERSION}"
            else
              echo "✅ 已从 CHANGELOG.md 中提取版本 $VERSION 的更新日志"
            fi
          else
            echo "⚠️ 未找到 CHANGELOG.md 文件，使用默认说明"
            NOTES="Release v${VERSION}"
          fi

          # 添加页脚
          NOTES="${NOTES}

          ---
          由GitHub Actions自动构建并发布
          Built and released automatically by GitHub Actions

          也可前往[嘉立创EDA扩展广场](https://jlc-ext.com/item/oshwhub/${EEXTNAME})下载
          Also available at [JLCEDA Extension Plaza](https://jlcext.com/item/oshwlab/${EEXTNAME})"

          # 使用 EOF 分隔符设置多行环境变量
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "------ Release Notes ------"
          echo "$NOTES"
          echo "---------------------------"

      - name: Set default release notes
        if: env.SKIP_RELEASE == 'false' && env.CI_CHANGELOG != 'true'
        run: |
          VERSION=${{ env.VERSION }}
          EEXTNAME=${{ env.EEXTNAME }}
          NOTES="Release v${VERSION}

          ---
          由GitHub Actions自动构建并发布
          Built and released automatically by GitHub Actions

          也可前往[嘉立创EDA扩展广场](https://jlc-ext.com/item/oshwhub/${EEXTNAME})下载
          Also available at [JLCEDA Extension Plaza](https://jlcext.com/item/oshwlab/${EEXTNAME})"

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build zh-cn package
        if: env.SKIP_RELEASE == 'false' && contains(env.CI_LOCALES, 'zh-cn')
        run: |
          VERSION=${{ env.VERSION }}
          EEXTNAME=${{ env.EEXTNAME }}
          DIST_DIR="$CI_BUILD_OUTPUT_DIR"
          BASE_FILE="${DIST_DIR}/${EEXTNAME}_v${VERSION}.eext"
          ZH_FILE="${DIST_DIR}/${EEXTNAME}_v${VERSION}_zh-cn.eext"
          THRESHOLD="$CI_CJK_THRESHOLD"

          echo "Building zh-cn package (cjk_threshold: $THRESHOLD)..."

          # Detect language by counting Chinese characters in README.md
          CN_COUNT=$(grep -oP '[\x{4e00}-\x{9fff}]' README.md 2>/dev/null | wc -l)
          if [ "$CN_COUNT" -gt "$THRESHOLD" ]; then
            IS_CHINESE=true
          else
            IS_CHINESE=false
          fi
          echo "README.md Chinese chars: $CN_COUNT, threshold: $THRESHOLD, is_chinese: $IS_CHINESE"

          if [ "$IS_CHINESE" = "true" ]; then
            # README.md is Chinese, just copy
            echo "README.md is Chinese, just copy"
            cp "$BASE_FILE" "$ZH_FILE"
          else
            # README.md is English, find zh readme from config patterns
            ZH_README=""
            IFS=',' read -ra PATTERNS <<< "$CI_ZH_CN_README"
            for pattern in "${PATTERNS[@]}"; do
              pattern=$(echo "$pattern" | xargs)  # trim whitespace
              if [[ "$pattern" == *"*"* ]]; then
                # Glob pattern — use ls to find match
                FOUND=$(ls $pattern 2>/dev/null | head -1)
                if [ -n "$FOUND" ]; then
                  ZH_README="$FOUND"
                  break
                fi
              else
                # Exact filename
                if [ -f "$pattern" ]; then
                  ZH_README="$pattern"
                  break
                fi
              fi
            done

            if [ -z "$ZH_README" ]; then
              echo "README.md is English, no zh readme found (patterns: $CI_ZH_CN_README), just copy"
              cp "$BASE_FILE" "$ZH_FILE"
            else
              echo "README.md is English, swap zh: $ZH_README"
              mv README.md README.en.md
              cp "$ZH_README" README.md
              find . -name "*.md" -not -path "./build/*" -not -path "./node_modules/*" -not -path "./.git/*" -exec sed -i 's/README\.md/README.en.md/g' {} +

              # Swap extension.json fields with locale translations
              ZH_I18N="$CI_ZH_CN_I18N"
              if [ -f "$ZH_I18N" ]; then
                echo "Swapping extension.json with $ZH_I18N translations..."
                TMP_EXT=$(mktemp)
                jq --slurpfile i18n "$ZH_I18N" '
                  (if .displayName then .displayName = ($i18n[0].displayName // $i18n[0][.displayName] // .displayName) else . end) |
                  (if .description then .description = ($i18n[0].description // $i18n[0][.description] // .description) else . end) |
                  (if .keywords then .keywords = [.keywords[] | ($i18n[0][.] // .)] else . end)
                ' extension.json > "$TMP_EXT" && mv "$TMP_EXT" extension.json
                echo "extension.json swapped"
              fi

              # 根据项目格式选择构建命令
              if [ -n "$CI_BUILD_COMMAND" ]; then
                eval "$CI_BUILD_COMMAND"
              elif [ "$IS_ESM" = "true" ]; then
                ESM_BUILD_SCRIPT=$(jq -r '.scripts["build:esm"] // empty' package.json 2>/dev/null)
                if [ -n "$ESM_BUILD_SCRIPT" ]; then
                  npm run build:esm
                else
                  if ! npm run build; then
                    echo "⚠️ 直接构建失败，使用 tsx 替代"
                    npm install -D tsx 2>/dev/null || true
                    cp package.json package.json.bak
                    jq '(.scripts.compile // "") |= gsub("ts-node"; "tsx") | (.scripts.build // "") |= gsub("ts-node"; "tsx")' package.json > package.json.tmp && mv package.json.tmp package.json
                    npm run build
                    mv package.json.bak package.json
                  fi
                fi
              else
                npm run build
              fi

              mv "$BASE_FILE" "$ZH_FILE"
              git checkout -- "*.md" 2>/dev/null || true
              git checkout -- extension.json 2>/dev/null || true
              rm -f README.en.md 2>/dev/null || true
            fi
          fi

          echo "Done: $ZH_FILE"

      - name: Build global package
        if: env.SKIP_RELEASE == 'false' && contains(env.CI_LOCALES, 'global')
        run: |
          VERSION=${{ env.VERSION }}
          EEXTNAME=${{ env.EEXTNAME }}
          DIST_DIR="$CI_BUILD_OUTPUT_DIR"
          BASE_FILE="${DIST_DIR}/${EEXTNAME}_v${VERSION}.eext"
          GLOBAL_FILE="${DIST_DIR}/${EEXTNAME}_v${VERSION}_global.eext"
          THRESHOLD="$CI_CJK_THRESHOLD"

          echo "Building global package (cjk_threshold: $THRESHOLD)..."

          # Detect language by counting Chinese characters in README.md
          CN_COUNT=$(grep -oP '[\x{4e00}-\x{9fff}]' README.md 2>/dev/null | wc -l)
          if [ "$CN_COUNT" -gt "$THRESHOLD" ]; then
            IS_CHINESE=true
          else
            IS_CHINESE=false
          fi
          echo "README.md Chinese chars: $CN_COUNT, threshold: $THRESHOLD, is_chinese: $IS_CHINESE"

          if [ "$IS_CHINESE" = "false" ]; then
            # README.md is English, just copy
            echo "README.md is English, just copy"
            cp "$BASE_FILE" "$GLOBAL_FILE"
          else
            # README.md is Chinese, find en readme from config patterns
            EN_README=""
            IFS=',' read -ra PATTERNS <<< "$CI_GLOBAL_README"
            for pattern in "${PATTERNS[@]}"; do
              pattern=$(echo "$pattern" | xargs)  # trim whitespace
              if [[ "$pattern" == *"*"* ]]; then
                # Glob pattern — use ls to find match
                FOUND=$(ls $pattern 2>/dev/null | head -1)
                if [ -n "$FOUND" ]; then
                  EN_README="$FOUND"
                  break
                fi
              else
                # Exact filename
                if [ -f "$pattern" ]; then
                  EN_README="$pattern"
                  break
                fi
              fi
            done

            if [ -z "$EN_README" ]; then
              echo "README.md is Chinese, no en readme found (patterns: $CI_GLOBAL_README), just copy"
              cp "$BASE_FILE" "$GLOBAL_FILE"
            else
              echo "README.md is Chinese, swap en: $EN_README"
              mv README.md README.zh.md
              cp "$EN_README" README.md
              find . -name "*.md" -not -path "./build/*" -not -path "./node_modules/*" -not -path "./.git/*" -exec sed -i 's/README\.md/README.zh.md/g' {} +

              # Swap extension.json fields with locale translations
              EN_I18N="$CI_GLOBAL_I18N"
              if [ -f "$EN_I18N" ]; then
                echo "Swapping extension.json with $EN_I18N translations..."
                TMP_EXT=$(mktemp)
                jq --slurpfile i18n "$EN_I18N" '
                  (if .displayName then .displayName = ($i18n[0].displayName // $i18n[0][.displayName] // .displayName) else . end) |
                  (if .description then .description = ($i18n[0].description // $i18n[0][.description] // .description) else . end) |
                  (if .keywords then .keywords = [.keywords[] | ($i18n[0][.] // .)] else . end)
                ' extension.json > "$TMP_EXT" && mv "$TMP_EXT" extension.json
                echo "extension.json swapped"
              fi

              # 根据项目格式选择构建命令
              if [ -n "$CI_BUILD_COMMAND" ]; then
                eval "$CI_BUILD_COMMAND"
              elif [ "$IS_ESM" = "true" ]; then
                ESM_BUILD_SCRIPT=$(jq -r '.scripts["build:esm"] // empty' package.json 2>/dev/null)
                if [ -n "$ESM_BUILD_SCRIPT" ]; then
                  npm run build:esm
                else
                  if ! npm run build; then
                    echo "⚠️ 直接构建失败，使用 tsx 替代"
                    npm install -D tsx 2>/dev/null || true
                    cp package.json package.json.bak
                    jq '(.scripts.compile // "") |= gsub("ts-node"; "tsx") | (.scripts.build // "") |= gsub("ts-node"; "tsx")' package.json > package.json.tmp && mv package.json.tmp package.json
                    npm run build
                    mv package.json.bak package.json
                  fi
                fi
              else
                npm run build
              fi

              mv "$BASE_FILE" "$GLOBAL_FILE"
              git checkout -- "*.md" 2>/dev/null || true
              git checkout -- extension.json 2>/dev/null || true
              rm -f README.zh.md 2>/dev/null || true
            fi
          fi

          echo "Done: $GLOBAL_FILE"

      - name: Cleanup base eext
        if: env.SKIP_RELEASE == 'false'
        run: |
          VERSION=${{ env.VERSION }}
          EEXTNAME=${{ env.EEXTNAME }}
          rm -f "${CI_BUILD_OUTPUT_DIR}/${EEXTNAME}_v${VERSION}.eext"
          echo "Removed base eext"

      - name: Debug check artifacts
        if: env.SKIP_RELEASE == 'false'
        run: |
          VERSION=${{ env.VERSION }}
          EEXTNAME=${{ env.EEXTNAME }}
          DIST_DIR="$CI_BUILD_OUTPUT_DIR"
          ZH_FILE="${DIST_DIR}/${EEXTNAME}_v${VERSION}_zh-cn.eext"
          GLOBAL_FILE="${DIST_DIR}/${EEXTNAME}_v${VERSION}_global.eext"

          echo "🔍 检查构建产物..."

          # Only check zh-cn if it was built
          if echo ",$CI_LOCALES," | grep -q ",zh-cn,"; then
            if [ -f "$ZH_FILE" ]; then
              echo "✅ 中文版产物存在: $ZH_FILE"
            else
              echo "❌ 中文版产物不存在: $ZH_FILE"
              ls -R build || true
              exit 1
            fi
          fi

          # Only check global if it was built
          if echo ",$CI_LOCALES," | grep -q ",global,"; then
            if [ -f "$GLOBAL_FILE" ]; then
              echo "✅ 国际版产物存在: $GLOBAL_FILE"
            else
              echo "❌ 国际版产物不存在: $GLOBAL_FILE"
              ls -R build || true
              exit 1
            fi
          fi

      - name: Upload Release
        if: env.SKIP_RELEASE == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          files: |
            ${{ needs.check-config.outputs.build_output_dir }}/${{ env.EEXTNAME }}_v${{ env.VERSION }}_zh-cn.eext
            ${{ needs.check-config.outputs.build_output_dir }}/${{ env.EEXTNAME }}_v${{ env.VERSION }}_global.eext
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
